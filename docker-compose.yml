services:
  postgres:
    image: postgres:16-alpine
    container_name: edupath_postgres
    restart: always
    environment:
      POSTGRES_USER: edupath
      POSTGRES_PASSWORD: edupath_secret_password
      POSTGRES_DB: edupath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupath -d edupath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
